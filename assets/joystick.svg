<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Base (arcade cabinet style) -->
  <rect x="20" y="80" width="160" height="100" fill="#2C2C2C" stroke="#1A1A1A" stroke-width="2" rx="8"/>
  
  <!-- Metal texture on base -->
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A3A3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2C2C2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="stickGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C0E;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Stick ball mount (circular base for stick) -->
  <circle cx="100" cy="100" r="28" fill="url(#metalGradient)" stroke="#0A0A0A" stroke-width="2"/>
  
  <!-- Inner circle (ball socket area) -->
  <circle cx="100" cy="100" r="24" fill="#1A1A1A" stroke="#0A0A0A" stroke-width="1"/>
  
  <!-- The stick itself (pointing up) -->
  <rect x="90" y="30" width="20" height="75" fill="url(#stickGradient)" stroke="#C73A0E" stroke-width="1" rx="4"/>
  
  <!-- Stick ball (top of stick) -->
  <circle cx="100" cy="25" r="12" fill="url(#stickGradient)" stroke="#C73A0E" stroke-width="2"/>
  
  <!-- Highlight on stick ball -->
  <circle cx="98" cy="23" r="4" fill="#FF8C53" opacity="0.8"/>
  
  <!-- Buttons (decorative) on base -->
  <!-- Red button -->
  <circle cx="60" cy="150" r="10" fill="#FF4444" stroke="#CC0000" stroke-width="1" opacity="0.8"/>
  <!-- Blue button -->
  <circle cx="140" cy="150" r="10" fill="#4444FF" stroke="#0000CC" stroke-width="1" opacity="0.8"/>
  <!-- Yellow button -->
  <circle cx="100" cy="160" r="8" fill="#FFDD00" stroke="#CCAA00" stroke-width="1" opacity="0.8"/>
  
  <!-- Shine/reflection -->
  <ellipse cx="100" cy="95" rx="12" ry="8" fill="white" opacity="0.1"/>
</svg>
